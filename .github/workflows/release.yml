name: Desktop Release

on:
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../../minierp-linux-x64.tar.gz bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-linux-x64
          path: minierp-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "minierp-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-windows-x64
          path: minierp-windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../minierp-macos.zip *.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-macos
          path: minierp-macos.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows
      - build-macos

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: minierp-linux-x64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: minierp-windows-x64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: minierp-macos
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/minierp-linux-x64.tar.gz
            release-assets/minierp-windows-x64.zip
            release-assets/minierp-macos.zip
          generate_release_notes: true
