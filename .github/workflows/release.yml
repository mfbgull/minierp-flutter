name: Desktop Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libglib2.0-dev
          echo 'PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"

      - name: Verify libsecret pkg-config availability
        shell: bash
        run: |
          pkg-config --modversion libsecret-1
          pkg-config --cflags --libs libsecret-1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Derive version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PUBSPEC_VERSION=$(sed -n 's/^version: \(.*\)$/\1/p' pubspec.yaml | cut -d'+' -f1)
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version $VERSION != pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Debian
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          mkdir -p dist \
            pkg/DEBIAN \
            pkg/usr/lib/minierp_app \
            pkg/usr/share/applications \
            pkg/usr/share/icons/hicolor/512x512/apps \
            pkg/usr/bin
          cp -r build/linux/x64/release/bundle/{minierp_app,lib,data} pkg/usr/lib/minierp_app/
          ln -sf ../lib/minierp_app/minierp_app pkg/usr/bin/minierp_app
          install -m 644 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png pkg/usr/share/icons/hicolor/512x512/apps/minierp_app.png
          cat > pkg/usr/share/applications/com.example.minierp_app.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MiniERP
          Exec=minierp_app
          Icon=minierp_app
          Terminal=false
          Categories=Office;Utility;
          EOF
          cat > pkg/DEBIAN/control <<EOF
          Package: minierp-app
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: MiniERP <noreply@example.com>
          Depends: libgtk-3-0, libsecret-1-0
          Description: MiniERP desktop client
          EOF
          dpkg-deb --build --root-owner-group pkg "dist/MiniERP-${VERSION}-linux-x64.deb"
          test -f "dist/MiniERP-${VERSION}-linux-x64.deb"

      - name: Verify Debian install
        shell: bash
        run: |
          sudo apt-get install -y ./dist/MiniERP-${VERSION}-linux-x64.deb
          dpkg -s minierp-app | grep -q 'Status: install ok installed'
          test -x /usr/bin/minierp_app
          test -f /usr/share/applications/com.example.minierp_app.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/minierp_app.png

      - name: Package AppImage
        shell: bash
        env:
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          mkdir -p AppDir/usr/bin AppDir/usr/lib/minierp_app
          cp -r build/linux/x64/release/bundle/{minierp_app,lib,data} AppDir/usr/lib/minierp_app/
          cat > AppDir/usr/bin/minierp_app <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/lib/minierp_app/minierp_app" "$@"
          EOF
          chmod +x AppDir/usr/bin/minierp_app
          install -m 644 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png AppDir/usr/share/icons/hicolor/512x512/apps/minierp_app.png
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png AppDir/minierp_app.png
          cat > AppDir/com.example.minierp_app.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MiniERP
          Exec=minierp_app
          Icon=minierp_app
          Terminal=false
          Categories=Office;Utility;
          EOF
          ln -sf usr/share/icons/hicolor/512x512/apps/minierp_app.png AppDir/.DirIcon
          wget -q -O linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appdir AppDir --output appimage
          mv MiniERP-*.AppImage "MiniERP-${VERSION}-linux-x64.AppImage"
          ./"MiniERP-${VERSION}-linux-x64.AppImage" --appimage-extract
          test -f squashfs-root/usr/lib/minierp_app/minierp_app
          test -f squashfs-root/usr/lib/minierp_app/lib/libflutter_linux_gtk.so
          rm -rf squashfs-root

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-linux-deb
          path: dist/MiniERP-${VERSION}-linux-x64.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-linux-appimage
          path: MiniERP-${VERSION}-linux-x64.AppImage

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PUBSPEC_VERSION=$(sed -n 's/^version: \(.*\)$/\1/p' pubspec.yaml | cut -d'+' -f1)
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version $VERSION != pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          $iscc = (Get-ChildItem -Path 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw 'ISCC.exe not found after Inno Setup install' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create Inno Setup script
        shell: bash
        run: |
          mkdir -p dist
          cat > installer.iss <<'EOFISS'
          #define MyAppName "MiniERP"
          #define MyAppVersion "{#VERSION}"
          #define MyAppExeName "minierp_app.exe"
          [Setup]
          AppId=com.example.minierpApp
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          DefaultDirName={autopf}\MiniERP
          DefaultGroupName=MiniERP
          OutputDir=dist
          OutputBaseFilename=MiniERP-{#MyAppVersion}-windows-x64
          SetupIconFile=windows\runner\resources\app_icon.ico
          Compression=lzma2/max
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          UninstallDisplayName={#MyAppName}
          WizardStyle=modern
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          [Icons]
          Name: "{group}\MiniERP"; Filename: "{app}\minierp_app.exe"
          Name: "{commondesktop}\MiniERP"; Filename: "{app}\minierp_app.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"; Flags: unchecked
          EOFISS

      - name: Compile installer
        shell: pwsh
        run: |
          & "$env:ISCC" installer.iss /DMyAppVersion=$env:VERSION
          if (-not (Test-Path "dist\MiniERP-$env:VERSION-windows-x64.exe")) { throw 'Windows installer not produced' }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-windows-installer
          path: dist/MiniERP-${{ env.VERSION }}-windows-x64.exe

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PUBSPEC_VERSION=$(sed -n 's/^version: \(.*\)$/\1/p' pubspec.yaml | cut -d'+' -f1)
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version $VERSION != pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release --darwin-arches arm64,x64

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          mkdir -p dmg_root
          cp -R build/macos/Build/Products/Release/minierp_app.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "MiniERP" -srcfolder dmg_root -ov -format UDZO "MiniERP-${VERSION}-macos.dmg"
          test -f "MiniERP-${VERSION}-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: minierp-macos-dmg
          path: MiniERP-${VERSION}-macos.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: minierp-*
          merge-multiple: true
          path: release-assets

      - name: Assert four release assets
        shell: bash
        run: |
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected 4 release assets, found $count" >&2
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
