name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Delegates to `npm run lint` so the rule set and flags have ONE
      # source of truth (scripts/check.sh runs the same command locally).
      - name: ESLint (zero errors gate)
        run: npm run lint
      - run: npm test
      # Case count is asserted by the script itself (EXPECTED_ASSERTIONS),
      # so it is deliberately not repeated in this label.
      - name: Reversal-rules verification gate
        run: npm run verify:reversal-rules

  # strictNullChecks is enabled in server/tsconfig.json, so the gating
  # `npm run typecheck` step above is the regression gate. The former
  # advisory-counting job was removed at the flip (see
  # server/STRICT_NULL_CHECKS.md).

  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit compares the tree against a base ref, so it must be local.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      # Fails only on findings NEW relative to the base ref, measured against
      # the committed baselines in audit/fallow-baselines/ — the legacy
      # backlog is baselined, not hidden. The version is pinned because the
      # baselines are only comparable against the analyzer that produced them.
      - name: Dead-code / complexity / duplication gate
        env:
          FALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: npx --yes fallow@3.34.1 audit --base "$FALLOW_BASE"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libglib2.0-dev \
            libsecret-1-0
          echo 'PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the same version release.yml builds with — an
          # unpinned `stable` lets CI compile syntax that the shipped
          # desktop build (and developers' local toolchains) cannot.
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # Fails on orphaned ur.arb translations and on the en→ur fallback gap
      # regressing past its cap (see scripts/l10n-drift.js).
      - name: l10n drift
        run: node scripts/l10n-drift.js
      - run: flutter test
