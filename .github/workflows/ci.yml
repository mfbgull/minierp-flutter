name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: ESLint (zero errors gate)
        run: npx eslint . --quiet
      - run: npm test
      - name: Reversal-rules verification (81-case gate)
        run: npm run verify:reversal-rules

  # Advisory only — reports the strictNullChecks error count but never blocks.
  # Tracked in server/STRICT_NULL_CHECKS.md; the flag flips once the count is 0.
  strict-nullchecks-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Count strictNullChecks errors
        id: count
        run: |
          npx tsc --noEmit --strictNullChecks > strict-null.log 2>&1 || true
          COUNT=$(grep -c 'error TS' strict-null.log || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### strictNullChecks advisory: $COUNT error(s)"
            echo ""
            echo "<details><summary>first 40</summary>"
            echo ""
            echo '```'
            grep 'error TS' strict-null.log | head -40 || echo "(none)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        run: |
          echo "strictNullChecks errors: ${{ steps.count.outputs.count }}"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libglib2.0-dev \
            libsecret-1-0
          echo 'PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
